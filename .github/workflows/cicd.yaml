name: CI/CD
on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  mage:
    uses: coopnorge/mage/.github/workflows/mage.yaml@v0.45.0
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets: inherit

  techdocs:
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    name: TechDocs
    uses: coopnorge/github-workflow-techdocs/.github/workflows/techdocs.yaml@v0.6.1

  build:
    needs:
      - mage
      - techdocs
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: "Catch errors"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
