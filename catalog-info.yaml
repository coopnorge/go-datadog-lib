apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: go-datadog-lib
  title: Go Datadog Library
  description: >-
    Deprecated, will be archived on 2027-03-01. Use
    github.com/coopnorge/go-telemetry-lib and OpenTelemetry. Datadog APM and
    metrics integration for Go services. One-call initialisation with
    distributed tracing middleware for gRPC, HTTP, SQL and GORM. Provides a
    go-logger hook for trace-correlated log entries.
  tags:
    - go
    - datadog
    - tracing
    - metrics
    - observability
    - apm
  annotations:
    github.com/project-slug: coopnorge/go-datadog-lib
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/coopnorge/go-telemetry-lib
      title: github.com/coopnorge/go-telemetry-lib
      icon: web
    - url: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/go/?tab=containers
      title: Official Datadog golang docs
      icon: web
    - url: https://docs.datadoghq.com/integrations/statsd/?tab=host
      title: Official Datadog StatsD docs
      icon: web
spec:
  type: library
  lifecycle: deprecated
  owner: backend-and-platform-engineering
